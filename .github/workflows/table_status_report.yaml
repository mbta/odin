name: Table Status Report

# Posts two Odin per-table freshness reports to Slack once a day:
# 1) the full engineering report to one channel (to #tid-fares-tech-data-platform)
# 2) a stakeholder report with just time-based rules (to #tt-fares-data-stakeholders)
#
# The report is never written to this job's log: `get_table_status.py --slack` captures
# its own stdout and POSTs it to the webhook. mbta/odin is a public repository, so job
# logs are world-readable

on:
  schedule:
    # 12:37 UTC daily (08:37 ET in summer, 07:37 ET in winter)
    # [scheduled actions are subject to delays or drops when load is high](https://docs.github.com/en/enterprise-cloud@latest/actions/reference/workflows-and-actions/events-that-trigger-workflows#schedule)
    - cron: "37 12 * * *"
  workflow_dispatch:
    inputs:
      detailed:
        description: Include a line for every table, OK ones included
        type: boolean
        default: false
      stale_seconds:
        description: No run within this many seconds counts as stale (86400 = 24h)
        type: string
        default: "86400"
      lag_seconds:
        description: Backlog over this many seconds counts as BEHIND_SOURCE (14400 = 4h)
        type: string
        default: "14400"

concurrency:
  group: table-status-report
  cancel-in-progress: false

jobs:
  report:
    name: Report Table Status
    runs-on: ubuntu-22.04
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout Branch
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # The status script only touches S3 via odin.utils.aws.s3, so it needs boto3 and
      # psutil, not the full requirements.txt
      - name: Install Dependencies
        run: pip install boto3 psutil

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Post Status Reports to Slack
        env:
          SLACK_FULL_REPORT_WEBHOOK: ${{ secrets.SLACK_FULL_REPORT_WEBHOOK }}
          SLACK_STAKEHOLDER_WEBHOOK: ${{ secrets.SLACK_STAKEHOLDER_WEBHOOK }}
          DATA_SPRINGBOARD: mbta-ctd-dataplatform-springboard
          PYTHONPATH: src
          ODIN_INSTANCE: alpha
        run: |
          python scripts/get_table_status.py \
            --slack \
            --stale-seconds "${{ inputs.stale_seconds || '86400' }}" \
            --source-lag-seconds "${{ inputs.lag_seconds || '14400' }}" \
            ${{ inputs.detailed && '--detailed' || '' }}
